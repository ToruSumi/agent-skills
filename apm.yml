name: agent-skills
version: 1.2.1
description: Original agent and skills
author: Sumi Toru
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, kiro, opencode, windsurf
targets:
  - copilot
  - opencode
dependencies:
  mcp: []
  apm:
    - git: jamesprial/github-skills
      ref: e7a08a4d27b0f1bf682e0484459a89151388388b
      skills:
        - gh-cli
    - git: gitea.com/gitea/cli
      ref: v1.2.0
      skills:
        - gt
    - path: ./packages/copilot
      targets: [copilot]
    - path: ./packages/opencode
      targets: [opencode]
includes: auto
scripts: {}
license: MIT
